<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Synchronized P2P AI Agents Chat</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #f0f2f5; padding: 15px; display: flex; justify-content: center; margin: 0; }
    .card { background: #fff; border-radius: 16px; padding: 20px; max-width: 600px; width: 100%; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    h2 { margin: 0 0 15px 0; color: #1877f2; text-align: center; }
    .box { background: #f7f8fa; border: 1px solid #e4e6eb; border-radius: 10px; padding: 12px; margin-bottom: 12px; }
    .my-id { font-family: monospace; font-weight: bold; color: #1877f2; background: #e7f3ff; padding: 4px 8px; border-radius: 4px; }
    
    input[type="text"] { width: 100%; padding: 10px; border: 1px solid #ccd0d5; border-radius: 8px; margin-bottom: 8px; font-size: 0.95rem; }
    .btn { background: #1877f2; color: #fff; border: none; padding: 10px 14px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; transition: 0.2s; }
    .btn:disabled { background: #e4e6eb; color: #bcc0c4; cursor: not-allowed; }
    .btn-success { background: #42b72a; }
    
    .chat-box { height: 380px; overflow-y: auto; border: 1px solid #e4e6eb; padding: 12px; border-radius: 10px; display: flex; flex-direction: column; gap: 10px; background: #fafafa; }
    .msg { padding: 10px 14px; border-radius: 10px; max-width: 85%; font-size: 0.9rem; line-height: 1.4; word-break: break-word; }
    
    /* สไตล์แยกตามประเภทข้อความ */
    .msg.system { background: #e4e6eb; color: #4b4f56; align-self: center; font-size: 0.8rem; border-radius: 20px; padding: 4px 12px; }
    .msg.user-prompt { background: #1877f2; color: #fff; align-self: center; text-align: center; width: 90%; font-weight: 500; }
    .msg.my-agent { background: #e7f3ff; color: #050505; align-self: flex-start; border-left: 4px solid #1877f2; }
    .msg.peer-agent { background: #f0f2f5; color: #050505; align-self: flex-end; border-right: 4px solid #42b72a; }
    
    .status { font-size: 0.82rem; color: #606770; margin-top: 6px; font-weight: 600; text-align: center; }
  </style>
</head>
<body>

<div class="card">
  <h2>🤖 Synchronized P2P AI Chat</h2>

  <!-- ส่วนตั้งค่าการเชื่อมต่อ -->
  <div class="box">
    <div><strong>Peer ID ของคุณ:</strong> <span id="my-id" class="my-id">กำลังสร้าง ID...</span></div>
    <div id="model-status" class="status">สถานะ: รอโหลดโมเดล AI</div>
    <button id="init-model-btn" class="btn" style="margin-top: 8px;">1. โหลดโมเดล WebLLM บนเครื่อง</button>
  </div>

  <div class="box">
    <input type="text" id="target-id" placeholder="วาง Peer ID ของเพื่อนที่นี่">
    <button id="connect-btn" class="btn" disabled>2. เชื่อมต่อ P2P หาเพื่อน</button>
  </div>

  <!-- หน้าจอแชทที่แสดงผลตรงกันทั้งสองฝั่ง -->
  <div class="chat-box" id="chat-box"></div>

  <!-- ส่วนให้ User พิมพ์โจทย์ -->
  <div style="margin-top: 12px;">
    <input type="text" id="user-input" placeholder="พิมพ์โจทย์ให้ AI ทั้งสองฝั่งช่วยกันคุย..." disabled>
    <button id="send-btn" class="btn btn-success" disabled>🚀 ส่งโจทย์ให้ AI เริ่มคุยกัน</button>
  </div>
</div>

<script type="module">
  import * as webllm from "https://esm.run/@mlc-ai/web-llm";

  const MODEL_NAME = "Llama-3.2-1B-Instruct-q4f16_1-MLC";
  const MAX_ROUNDS = 3; // จำนวนรอบที่ AI จะคุยโต้ตอบกัน

  let engine = null;
  let peer = null;
  let conn = null;
  let myRole = "Agent A"; // ฝั่งริเริ่มส่งโจทย์จะเป็น Agent A อีกฝั่งจะเป็น Agent B

  const myIdEl = document.getElementById('my-id');
  const modelStatusEl = document.getElementById('model-status');
  const initModelBtn = document.getElementById('init-model-btn');
  const targetIdInput = document.getElementById('target-id');
  const connectBtn = document.getElementById('connect-btn');
  const userInput = document.getElementById('user-input');
  const sendBtn = document.getElementById('send-btn');
  const chatBox = document.getElementById('chat-box');

  // 1. เริ่มต้นระบบ PeerJS
  peer = new Peer();
  peer.on('open', (id) => myIdEl.textContent = id);

  // เมื่อมีเพื่อนเชื่อมต่อเข้ามา
  peer.on('connection', (incomingConn) => {
    conn = incomingConn;
    myRole = "Agent B"; // เครื่องนี้รับการเชื่อมต่อ -> ตั้งเป็น Agent B
    setupConnectionEvents();
    appendMessage("ระบบ", "มีเพื่อนเชื่อมต่อเข้ามาแล้ว!", "system");
  });

  // 2. โหลดโมเดล WebLLM
  initModelBtn.onclick = async () => {
    initModelBtn.disabled = true;
    modelStatusEl.textContent = "กำลังโหลดโมเดล AI ลง WebGPU...";

    try {
      engine = await webllm.CreateMLCEngine(MODEL_NAME, {
        initProgressCallback: (p) => modelStatusEl.textContent = p.text
      });
      modelStatusEl.textContent = "✅ โมเดลพร้อมใช้งานแล้ว!";
      connectBtn.disabled = false;
    } catch (err) {
      modelStatusEl.textContent = "❌ โหลดโมเดลไม่สำเร็จ: " + err.message;
      initModelBtn.disabled = false;
    }
  };

  // 3. กดเชื่อมต่อหาเพื่อน
  connectBtn.onclick = () => {
    const targetId = targetIdInput.value.trim();
    if (!targetId) return alert('กรุณากรอก Peer ID ของเพื่อน');
    
    conn = peer.connect(targetId);
    myRole = "Agent A"; // เครื่องนี้เป็นคนกดต่อหาเพื่อน -> ตั้งเป็น Agent A
    setupConnectionEvents();
  };

  function setupConnectionEvents() {
    conn.on('open', () => {
      appendMessage("ระบบ", "เชื่อมต่อ P2P สำเร็จ! พร้อมเริ่มการสนทนา", "system");
      userInput.disabled = false;
      sendBtn.disabled = false;
    });

    // รับข้อมูลสัญญาณจากอีกฝั่งเพื่อ Sync หน้าจอ
    conn.on('data', async (data) => {
      // ฝั่งตรงข้ามส่งโจทย์มา
      if (data.type === 'START_PROMPT') {
        appendMessage("User", data.prompt, "user-prompt");
      }
      
      // ฝั่งตรงข้ามส่งข้อความ AI ของเขามา
      else if (data.type === 'AI_SPEECH') {
        appendMessage(data.agentRole, data.text, "peer-agent");

        // หากยังไม่ครบจำนวนรอบ ให้ AI เครื่องเราประมวลผลคำตอบโต้ตอบกลับไป
        if (data.round < MAX_ROUNDS) {
          await generateLocalAIResponse(data.originalPrompt, data.text, data.round + 1);
        } else {
          appendMessage("ระบบ", "จบการแลกเปลี่ยนความเห็น (ครบกำหนดรอบ)", "system");
        }
      }
    });
  }

  // 4. เมื่อ User กดส่งโจทย์
  sendBtn.onclick = async () => {
    const prompt = userInput.value.trim();
    if (!prompt || !engine || !conn) return;

    userInput.value = '';

    // แสดงโจทย์บนหน้าจอตัวเอง และยิงไปแสดงที่หน้าจอเพื่อน
    appendMessage("User", prompt, "user-prompt");
    conn.send({ type: 'START_PROMPT', prompt: prompt });

    // เริ่มต้นให้ AI เครื่องนี้ (Agent A) คิดคำตอบแรก
    await generateLocalAIResponse(prompt, "เริ่มต้นการแลกเปลี่ยนความคิดเห็น", 1);
  };

  // ฟังก์ชันให้ WebLLM ในเครื่องประมวลผลคำตอบ
  async function generateLocalAIResponse(originalPrompt, lastMessage, round) {
    appendMessage("ระบบ", `${myRole} (เครื่องนี้) กำลังประมวลผล...`, "system");

    const systemPrompt = `คุณคือ ${myRole} ร่วมมือกับ AI อีกเครื่องเพื่อช่วยกันหาคำตอบที่ดีที่สุด
โจทย์หลักจากผู้ใช้: "${originalPrompt}"
ความเห็นล่าสุดจาก AI อีกฝั่ง: "${lastMessage}"
หน้าที่ของคุณ: ให้ความคิดเห็นเสริม ข้อคิดเห็นโต้แย้ง หรือจุดที่ยังขาดไปอย่างสั้นๆ กระชับ (ไม่เกิน 3 ประโยค)`;

    const completion = await engine.chat.completions.create({
      messages: [
        { role: "system", content: systemPrompt },
        { role: "user", content: "โปรดวิเคราะห์และแสดงความคิดเห็น" }
      ]
    });

    const aiText = completion.choices[0].message.content;

    // 1. แสดงคำตอบของ AI ตัวเองบนหน้าจอเรา
    appendMessage(`${myRole} (เครื่องนี้)`, aiText, "my-agent");

    // 2. ส่งคำตอบไปแสดงที่หน้าจอฝั่งเพื่อน และกระตุ้นให้ AI ฝั่งโน้นทำงานต่อ
    conn.send({
      type: 'AI_SPEECH',
      agentRole: myRole,
      text: aiText,
      originalPrompt: originalPrompt,
      round: round
    });
  }

  // ฟังก์ชันช่วยแสดงผลบน UI
  function appendMessage(sender, text, styleClass) {
    const msgDiv = document.createElement('div');
    msgDiv.className = `msg ${styleClass}`;
    
    if (styleClass === 'system' || styleClass === 'user-prompt') {
      msgDiv.innerHTML = `<strong>${sender}:</strong> ${text}`;
    } else {
      msgDiv.innerHTML = `<strong>${sender}:</strong><br>${text}`;
    }

    chatBox.appendChild(msgDiv);
    chatBox.scrollTop = chatBox.scrollHeight;
  }
</script>

</body>
</html>
